[project]
name = "proda"
version = "0.1.0"
description = "Project Delivery Assistant: Jira weekly progress reports with AI narration"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
proda = "proda.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["proda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
